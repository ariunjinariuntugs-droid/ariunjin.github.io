<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hangman Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game">
    <h1>Hangman</h1>
    <button class="start-btn" onclick="startGame()">Start Game</button>

    <div class="round" id="round"></div>
    <div class="question" id="question"></div>
    <div class="answer" id="answer"></div>

    <div class="letters" id="letters"></div>

    <div class="hangman" id="hangman"></div>
    <div class="status" id="status"></div>
  </div>

  <script>
    const questions = [
      'Biggest Mammal?',
      'Fastest vehicle?',
      'Largest planet?',
      'Hottest planet?',
      'Fastest land animal?',
      'Tallest animal?',
      'Largest ocean?',
      'Hardest natural substance?',
      'Planet known as the Red Planet?',
      'Largest bird?'
    ];

    const answers = [
      'Whale',
      'Jet',
      'Jupiter',
      'Venus',
      'Cheetah',
      'Giraffe',
      'Pacific',
      'Diamond',
      'Mars',
      'Ostrich'
    ];

    let currentRound = 0;
    let selectedAnswer = '';
    let displayed = [];
    let mistakes = 0;
    const maxMistakes = hangmanStages.lenth - 1;

const hangmanStages = [
`\n\n\n\n\n_____`,
` |\n |\n |\n |\n_|____`,
` ____\n |  |\n |\n |\n_|____`,
` ____\n |  |\n |  O\n |\n_|____`,
` ____\n |  |\n |  O\n |  |\n_|____`,
` ____\n |  |\n |  O\n |  |\n_|____`,
` ____\n |  |\n |  O\n | /| \n_|____`,
` ____\n |  |\n |  O\n | /|\\\n_|____`,
` ____\n |  |\n |  O\n | /|\\\n_|_/`,
` ____\n |  |\n |  O\n | /|\\\n_|_/ \\__`
];

    function startGame() {
      document.querySelector('.start-btn').style.display = 'none';

      currentRound = 0;
      startRound();
    }


    function startRound() {
      if (currentRound >= questions.length) {
        document.getElementById('status').textContent = '🏆 Game Finished! You completed all rounds!';
        document.getElementById('question').textContent = '';
        document.getElementById('answer').textContent = '';
        document.getElementById('letters').innerHTML = '';
        document.getElementById('hangman').textContent = '';
        document.getElementById('round').textContent = '';
        return;
      }

      selectedAnswer = answers[currentRound].toUpperCase();
      displayed = Array(selectedAnswer.length).fill('_');
      mistakes = 0;

      document.getElementById('round').textContent = `Round ${currentRound + 1} of ${questions.length}`;
      document.getElementById('question').textContent = questions[currentRound];
      document.getElementById('status').textContent = '';
      updateAnswer();
      updateHangman();
      createLetterButtons();
    }

    function createLetterButtons() {
      const lettersDiv = document.getElementById('letters');
      lettersDiv.innerHTML = '';

      for (let i = 65; i <= 90; i++) {
        const btn = document.createElement('button');
        const letter = String.fromCharCode(i);
        btn.textContent = letter;
        btn.onclick = () => guessLetter(letter, btn);
        lettersDiv.appendChild(btn);
      }
    }

    function guessLetter(letter, btn) {
      btn.disabled = true;

      if (selectedAnswer.includes(letter)) {
        for (let i = 0; i < selectedAnswer.length; i++) {
          if (selectedAnswer[i] === letter) {
            displayed[i] = letter;
          }
        }
      } else {
        mistakes++;
      }

      updateAnswer();
      updateHangman();
      checkGameOver();
    }

    function updateAnswer() {
      document.getElementById('answer').textContent = displayed.join(' ');
    }

    function updateHangman() {
      document.getElementById('hangman').textContent = hangmanStages[mistakes];
    }

    function checkGameOver() {
      const status = document.getElementById('status');

      if (!displayed.includes('_')) {
        status.textContent = '🎉 Correct! Moving to next round...';
        disableAllButtons();
        currentRound++;
        setTimeout(startRound, 1500); // move to next round after 1.5 sec
      } else if (mistakes >= maxMistakes) {
        status.textContent = `💀 Game Over! Answer was: ${selectedAnswer}. Next round...`;
        disableAllButtons();
        currentRound++;
        setTimeout(startRound, 2000); // move to next round after 2 sec
      }
    }

    function disableAllButtons() {
      document.querySelectorAll('.letters button').forEach(b => b.disabled = true);
    }
  </script>
</body>
</html>
